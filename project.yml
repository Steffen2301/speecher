name: Speecher
options:
  bundleIdPrefix: com.steffen2301
  deploymentTarget:
    macOS: "14.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

packages:
  SpeecherCore:
    path: SpeecherCore

targets:
  Speecher:
    type: application
    platform: macOS
    sources:
      - path: Speecher/Sources
    resources:
      - path: Speecher/Resources
    dependencies:
      - package: SpeecherCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steffen2301.speecher
        INFOPLIST_FILE: Speecher/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: Speecher/Supporting/Speecher.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: Speecher/Supporting/Speecher.entitlements

  SpeecherTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SpeecherTests
    dependencies:
      - target: Speecher
      - package: SpeecherCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steffen2301.speecher.tests

schemes:
  Speecher:
    build:
      targets:
        Speecher: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpeecherTests
    profile:
      config: Release
    archive:
      config: Release
