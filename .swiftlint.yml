included:
  - Speecher/Sources
  - SpeecherCore/Sources

excluded:
  - .build
  - DerivedData

disabled_rules:
  - trailing_whitespace
  - trailing_comma                      # Trailing commas sind Stilsache
  - colon                               # Colon-Spacing variiert
  - redundant_string_enum_value         # CorrectionService Mode enum ist explizit
  - optional_data_string_conversion     # DataString konversion ist OK

opt_in_rules:
  - empty_count
  - private_outlet

# Gelockerte Regeln für schnelle Entwicklung
identifier_name:
  min_length: 1           # Erlaube 1-Buchstaben-Variablen
  max_length: 40
  allowed_symbols:        # Underscores in Identifiern (für JSON-Keys wie max_tokens)
    - "_"

nesting:
  type_level: 3           # Nested Types bis 3 Ebenen erlaubt (z.B. nested structs in Views)

line_length:
  warning: 130
  error: 160

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 800
